name: Build APK

# Workflow بسيط لبناء ملف APK وتحميله من صفحة الـ Actions (Artifacts).
# لا يحتاج أي secrets. يعمل تلقائياً عند الـ push على الفرع، ويمكن تشغيله يدوياً.

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare google-services.json
        # الـ release variant محتاج الملف ده، والـ mock اللي في gradle بيتعمل للـ debug بس.
        # لو عندك secret اسمه GOOGLE_SERVICES_JSON بيتم استخدامه، غير كده بيتعمل ملف وهمي.
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/google-services.json
            echo "Using GOOGLE_SERVICES_JSON secret"
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "firebase_url": "https://mock-project-default-rtdb.firebaseio.com",
              "project_id": "mock-project",
              "storage_bucket": "mock-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:mockappid123456",
                  "android_client_info": {
                    "package_name": "pro.sketchware"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "mock_AIzaSyBQJCUXVKUjD38-u5pWkqMtesIfFvxAcvs" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "Using placeholder google-services.json"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Show error summary on failure
        if: ${{ failure() }}
        run: |
          {
            echo "## Build failed - error summary"
            echo '```'
            grep -E -A3 "What went wrong|FAILURE|error:|Could not|Exception" build-log.txt | head -c 15000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sketchware-pro-${{ github.sha }}
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
