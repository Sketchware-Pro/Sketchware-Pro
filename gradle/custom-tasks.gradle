import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

/**
 * Creates a mock google-services.json if GOOGLE_SERVICES_JSON environment variable is absent.
 */
tasks.register('createMockGoogleServices') {
    doLast {
        def secrets = System.getenv("GOOGLE_SERVICES_JSON")
        if (secrets != null && !secrets.trim().isEmpty()) {
            new File("$projectDir/google-services.json").text = secrets
            return
        }
        def rootMockFile = file("google-services.json")
        if (rootMockFile.exists() && rootMockFile.length() == 0) {
            rootMockFile.delete()
        }
        def mockFile = file("src/debug/google-services.json")
        if (!mockFile.exists()) {
            mockFile.parentFile.mkdirs()
            def mockContent = """{
  "project_info": {
    "project_number": "123456789000",
    "firebase_url": "https://mock-project-default-rtdb.firebaseio.com",
    "project_id": "mock-project",
    "storage_bucket": "mock-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789000:android:mockappid123456",
        "android_client_info": {
          "package_name": "${android.defaultConfig.applicationId}"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "mock_AIzaSyBQJCUXVKUjD38-u5pWkqMtesIfFvxAcvs"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}"""
            mockFile.text = mockContent
        }
    }
}

preBuild.dependsOn createMockGoogleServices

/**
 * Strips embedded .dex entries from bundletool.jar to prevent R8 bytecode collision errors.
 */
@SuppressWarnings('GrMethodMayBeStatic')
def cleanJarDexEntries(File jarFile) {
    try {
        def tempFile = new File(jarFile.parentFile, jarFile.name + ".tmp")
        def zipFile = new ZipFile(jarFile)
        def zos = new ZipOutputStream(new FileOutputStream(tempFile))
        def buffer = new byte[8192]
        boolean modified = false

        zipFile.entries().each { entry ->
            if (entry.name.endsWith(".dex")) {
                modified = true
            } else {
                def newEntry = new ZipEntry(entry.name)
                zos.putNextEntry(newEntry)
                def is = zipFile.getInputStream(entry)
                int len
                while ((len = is.read(buffer)) > 0) {
                    zos.write(buffer, 0, len)
                }
                is.close()
                zos.closeEntry()
            }
        }
        zos.close()
        zipFile.close()

        if (modified) {
            jarFile.delete()
            tempFile.renameTo(jarFile)
        } else {
            tempFile.delete()
        }
    } catch (Exception ignored) {
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("minify") || task.name.contains("R8")) {
        task.doFirst {
            project.configurations.findByName("releaseRuntimeClasspath")?.files?.each { file ->
                if (file.name.contains("bundletool") && file.name.endsWith(".jar") && file.exists()) {
                    cleanJarDexEntries(file)
                }
            }
        }
    }
}
